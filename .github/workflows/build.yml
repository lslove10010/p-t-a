name: Build Static Binary

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static binary in Alpine
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            python:3.11-alpine sh -c "
              apk add --no-cache gcc musl-dev linux-headers zlib-dev
              pip install pyinstaller aiohttp
              python -m PyInstaller \
                --onefile \
                --name server \
                --strip \
                --hidden-import aiohttp \
                --hidden-import aiohttp.web \
                server.py
            "

      - name: Check binary
        run: |
          file ./dist/server
          ls -lh ./dist/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}-static
          path: dist/server

      - name: Release binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/server
          name: Release ${{ github.ref_name }} (${{ matrix.arch }} static)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
